<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada · Tondato Traslados</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="stylesheet" href="/assets/css/style.css">
<style>
  .err { display:grid; place-items:center; min-height:100svh; text-align:center; padding:40px 20px; }
  .err__code { font-family:'Montserrat',sans-serif; font-size:clamp(5rem,20vw,11rem); font-weight:900;
    line-height:.9; letter-spacing:-.05em;
    background:linear-gradient(140deg,#fff 20%,var(--brand-500)); -webkit-background-clip:text;
    background-clip:text; color:transparent; }
  .err h1 { margin-top:18px; font-size:var(--step-h2); }
  .err p { margin-top:16px; max-width:46ch; color:var(--fg-muted); }
  .err .btn { margin-top:32px; }
  .err img { height:44px; width:auto; margin-bottom:34px; }
</style>
</head>
<body>
  <main class="err">
    <div>
      <img src="/img/logo-light.png" width="454" height="147" alt="Tondato Traslados">
      <p class="err__code">404</p>
      <h1>Nos fuimos de ruta</h1>
      <p>La página que buscabas no existe o cambió de dirección. Volvé al inicio
         o escribinos y te ayudamos a encontrar lo que necesitás.</p>
      <a class="btn btn--primary btn--lg" href="/">Volver al inicio</a>
    </div>
  </main>
</body>
</html>
